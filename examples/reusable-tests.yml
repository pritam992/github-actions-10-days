name: Reusable tests
on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: '3.12'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}
      - run: python -m unittest discover -s app -v
